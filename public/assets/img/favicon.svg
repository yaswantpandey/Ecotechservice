<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140e" />
      <stop offset="50%" stop-color="#05241b" />
      <stop offset="100%" stop-color="#010c08" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    <!-- Leaf Base Gradient -->
    <linearGradient id="leafBodyGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="45%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Tech Circuit Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Node Core Light -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </radialGradient>

    <!-- Filter for subtle circuit glow -->
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Square Frame with Cyber Emerald Tint -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.6" />

  <!-- EcoTech Circuit Leaf Silhouette (Centered & Bold for high visibility) -->
  <path d="M 14 38
           C 12 30 15 21 22 15
           L 38 9
           C 45 7 51 11 53 18
           C 55 26 52 35 45 44
           L 29 53
           C 21 57 16 48 14 38 Z"
        fill="url(#leafBodyGrad)"
        stroke="#10b981"
        stroke-width="1.2" />

  <!-- Inner Leaf Dark Field for High Circuit Contrast -->
  <path d="M 16 36 C 14 29 18 21 24 16 L 38 11 C 44 9 49 12 51 18 C 47 28 37 43 27 50 C 21 51 17 44 16 36 Z"
        fill="#011f17"
        opacity="0.75" />

  <!-- Central Spine (Diagonal Divider) -->
  <line x1="16" y1="48" x2="49" y2="15"
        stroke="url(#circuitGrad)"
        stroke-width="2.8"
        stroke-linecap="round"
        filter="url(#circuitGlow)" />

  <!-- Top-Left Circuit Traces -->
  <!-- Track 1 -->
  <path d="M 23 41 L 19 35 L 19 27 L 25 21"
        fill="none"
        stroke="url(#circuitGrad)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <!-- Track 2 -->
  <path d="M 30 34 L 26 28 L 29 23 L 34 18"
        fill="none"
        stroke="url(#circuitGrad)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <!-- Track 3 -->
  <path d="M 37 27 L 35 22 L 39 16 L 43 14"
        fill="none"
        stroke="url(#circuitGrad)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <!-- Branch -->
  <path d="M 26 28 L 32 28"
        fill="none"
        stroke="url(#circuitGrad)"
        stroke-width="1.8"
        stroke-linecap="round" />

  <!-- Bottom-Right Circuit Traces -->
  <!-- Track 4 -->
  <path d="M 27 45 L 33 45 L 38 40 L 38 34"
        fill="none"
        stroke="url(#circuitGrad)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <!-- Track 5 -->
  <path d="M 34 38 L 40 38 L 45 33 L 45 25"
        fill="none"
        stroke="url(#circuitGrad)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <!-- Track 6 -->
  <path d="M 41 31 L 46 31 L 49 26 L 49 20"
        fill="none"
        stroke="url(#circuitGrad)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <!-- Branch -->
  <path d="M 40 38 L 40 44"
        fill="none"
        stroke="url(#circuitGrad)"
        stroke-width="1.8"
        stroke-linecap="round" />

  <!-- Glowing Solder Pads / Nodes -->
  <circle cx="25" cy="21" r="2" fill="url(#nodeGlow)" />
  <circle cx="34" cy="18" r="2" fill="url(#nodeGlow)" />
  <circle cx="43" cy="14" r="2" fill="url(#nodeGlow)" />
  <circle cx="32" cy="28" r="1.8" fill="url(#nodeGlow)" />
  <circle cx="19" cy="27" r="1.8" fill="url(#nodeGlow)" />

  <circle cx="38" cy="34" r="2" fill="url(#nodeGlow)" />
  <circle cx="45" cy="25" r="2" fill="url(#nodeGlow)" />
  <circle cx="49" cy="20" r="2" fill="url(#nodeGlow)" />
  <circle cx="40" cy="44" r="1.8" fill="url(#nodeGlow)" />

  <!-- Apex and Base Terminal Dots -->
  <circle cx="49" cy="15" r="2.5" fill="#ffffff" filter="url(#circuitGlow)" />
  <circle cx="16" cy="48" r="2.4" fill="#34d399" />
</svg>
