name: CI/CD Deployment via FTP

on:
  push:
    branches:
      - main # Trigger deployment when code is pushed to the 'main' branch

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # PHPMailer is a Composer dependency and vendor/ is not committed, so
      # build it here; without it every site email is silently skipped.
      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: 📦 Install PHP dependencies (PHPMailer)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # Mail credentials come from repository secrets SMTP_USER / SMTP_PASS
      # and are written to .env.mail (never committed). Skipped when the
      # secrets are not set, so a hand-made .env.mail on the server survives.
      - name: ✉️ Write mail settings
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            {
              echo 'SMTP_HOST="smtp.hostinger.com"'
              echo 'SMTP_PORT="465"'
              echo 'SMTP_ENCRYPTION="ssl"'
              printf 'SMTP_USER="%s"\n' "$SMTP_USER"
              printf 'SMTP_PASS="%s"\n' "$SMTP_PASS"
              printf 'SMTP_FROM="%s"\n' "$SMTP_USER"
            } > .env.mail
            echo "Wrote .env.mail for $SMTP_USER"
          else
            echo "SMTP_USER / SMTP_PASS secrets not set; leaving server mail settings unchanged."
          fi

      - name: 📂 Sync files to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Set the local directory you want to upload ('.' means the whole repository)
          local-dir: ./
          # Set the destination directory on the server (usually 'htdocs/' for InfinityFree)
          server-dir: ./ecotechservice.kesug.com/htdocs/
          # Exclude files/folders you don't want to override on the server
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/logs/**
            **/public/uploads/**
            !public/uploads/.htaccess
            database/**
            scratch/**
            .cortex/**
            .github/**
            README.md
            seo_pages.sql
            global_seo_pages.sql
            reset_password.php
