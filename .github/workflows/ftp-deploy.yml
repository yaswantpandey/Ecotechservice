name: CI/CD Deployment via FTP

on:
  push:
    branches:
      - main # Trigger deployment when code is pushed to the 'main' branch

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # PHPMailer is a Composer dependency and vendor/ is not committed, so
      # build it here; without it every site email is silently skipped.
      - name: 🐘 Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: 📦 Install PHP dependencies (PHPMailer)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # Mail credentials come from repository secrets SMTP_USER / SMTP_PASS
      # and are written to .env.mail (never committed). Skipped when the
      # secrets are not set, so a hand-made .env.mail on the server survives.
      - name: ✉️ Write mail settings
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then
            {
              echo 'SMTP_HOST="smtp.hostinger.com"'
              echo 'SMTP_PORT="465"'
              echo 'SMTP_ENCRYPTION="ssl"'
              printf 'SMTP_USER="%s"\n' "$SMTP_USER"
              printf 'SMTP_PASS="%s"\n' "$SMTP_PASS"
              printf 'SMTP_FROM="%s"\n' "$SMTP_USER"
            } > .env.mail
            echo "Wrote .env.mail for $SMTP_USER"
          else
            echo "SMTP_USER / SMTP_PASS secrets not set; leaving server mail settings unchanged."
          fi

      - name: 📁 Ensure remote directories exist
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          php -r '
            $server = getenv("FTP_SERVER");
            $user   = getenv("FTP_USERNAME");
            $pass   = getenv("FTP_PASSWORD");
            $target = "ecotechservices.tech/htdocs";

            echo "Connecting to FTP: $server ...\n";
            $conn = @ftp_connect($server, 21, 30);
            if (!$conn) {
                echo "Warning: Could not connect to FTP server: $server\n";
                exit(0);
            }
            if (!@ftp_login($conn, $user, $pass)) {
                echo "Warning: FTP login failed for user: $user\n";
                exit(0);
            }
            ftp_pasv($conn, true);

            echo "\n=== Remote FTP Root Listing ===\n";
            $items = ftp_nlist($conn, ".") ?: [];
            foreach ($items as $item) {
                echo " - " . basename($item) . "\n";
            }
            echo "================================\n\n";

            // Recursively create target folder if missing
            $parts = explode("/", trim($target, "/"));
            $path = "";
            foreach ($parts as $p) {
                $path .= ($path ? "/" : "") . $p;
                if (@ftp_chdir($conn, $path)) {
                    echo "Directory confirmed: $path\n";
                    ftp_cdup($conn);
                } else {
                    echo "Directory missing: $path. Attempting to create...\n";
                    if (@ftp_mkdir($conn, $path)) {
                        echo "Created directory: $path\n";
                    } else {
                        echo "Notice: Could not create $path directly via FTP.\n";
                    }
                }
            }
            ftp_close($conn);
          '

      - name: 📂 Sync files to InfinityFree via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          log-level: verbose
          # Set the local directory you want to upload ('.' means the whole repository)
          local-dir: ./
          # Set the destination directory on the server
          server-dir: ecotechservices.tech/htdocs/
          # Exclude files/folders you don't want to override on the server
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/logs/**
            **/public/uploads/**
            database/**
            scratch/**
            .cortex/**
            .github/**
            README.md
            seo_pages.sql
            global_seo_pages.sql
            reset_password.php
